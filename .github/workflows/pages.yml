name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Install browser and recording tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil
      - name: Play the campaign and studio on desktop and mobile
        run: npm run test:e2e
      - name: Prepare MP4 playthroughs and review frames
        if: always()
        run: python3 scripts/review-recordings.py qa/final
      - name: Save coverage and playthrough recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-playthroughs
          retention-days: 14
          path: |
            coverage/
            qa/final/**/*.mp4
            qa/final/**/scenario.json
            qa/final/**/audio.json
            qa/final/recordings.json
            qa/final/index.html
            qa/final/**/review-*.jpg
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
